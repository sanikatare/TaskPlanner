services:
  - type: web
    name: tasktrack-ai
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: ALLOW_DEV_AUTH
        value: "true"
      - key: VITE_ALLOW_DEV_AUTH
        value: "true"
      - key: VITE_USE_MONGO_AUTH
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
